server:
  port: 9000

spring:
  application:
    name: yorimichi

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_ESj5YRRBK

  profiles:
    active: rds



  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update



  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: localhost
      port: 6379


# Cognito administration
cognito:
  region: ${AWS_REGION:ap-northeast-2}
  user-pool-id: ${COGNITO_USER_POOL_ID:ap-northeast-2_ESj5YRRBK}
  client-id: ${COGNITO_CLIENT_ID:43cd6ulvfskaor839f9ct2vlb5}


# CORS
cors:
  allowed-origins:
    - http://localhost:*
    - http://127.0.0.1:*
    - http://192.168.*.*:*
    - http://172.16.*.*:*
    - http://172.17.*.*:*
    - http://172.18.*.*:*
    - http://172.19.*.*:*
    - http://172.2*.*.*:*
    - http://172.30.*.*:*
    - http://172.31.*.*:*
    - http://10.*.*.*:*


# MyBatis
mybatis:
  type-aliases-package: com.yorimichi.yorimichi.domain
  # mapper-locations는 프로필별로 지정합니다 (local / rds 섹션 참고).
  # UserMapper.xml이 mapper-local, mapper-cognito 두 곳에 있고 namespace가 같아서
  # 둘을 동시에 로드하면 충돌하므로 프로필마다 한쪽만 읽습니다.
  configuration:
    map-underscore-to-camel-case: true


# 파일 업로드 (local 프로필 전용 디스크 경로. S3 설정은 rds 프로필 섹션 참고)
file:
  upload:
    # 프로젝트 폴더(yorimichi) 기준 상대 경로. STS/이클립스로 실행하면 yorimichi/upload에 저장됩니다.
    windows: ./upload/
    linux: /app/upload/

# 이미지 저장소 — local 프로필이 /images/**로 직접 서빙할 때 쓰는 주소
app:
  image:
    local-base-url: http://localhost:9000/images


# Python 서버
python:
  server:
    url: http://localhost:8000


# ============================================
# LOCAL — 로컬 MySQL
#
# 평소 개발할 때 쓰는 기본 프로필입니다.
# 이미지도 이 프로필에서는 로컬 디스크(file.upload.*)에 저장됩니다.
# ============================================

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yorimichi_db?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
    username: yorimichi
    password: yorimichi

# 로컬: 비밀번호(password) 방식 UserMapper
mybatis:
  mapper-locations:
    - classpath:mapper/**/*.xml
    - classpath:mapper-local/**/*.xml

app:
  # Comma-separated Cognito emails that receive ADMIN in the local database.
  # This setting is evaluated only when the local profile is active.
  local-admin-emails: ${LOCAL_ADMIN_EMAILS:gusals0908@gmail.com}


# ============================================
# RDS — AWS 운영 DB
#
# 접속 전에 SSM 터널을 먼저 열어야 합니다.
#   .\scripts\connect-rds.ps1
# 그 창을 닫으면 연결이 끊깁니다.
#
# 계정은 개인별로 다르므로 환경변수로 분리합니다.
#   DB_USERNAME : 본인 IAM 사용자명 (예: yoo-youngsu)
#   DB_PASSWORD : connect-rds.ps1이 클립보드에 복사해준 값
#
# 이미지도 이 프로필에서는 S3에 저장됩니다 (app.image.s3.*).
# S3_IMAGE_BUCKET은 실제 버킷을 만든 뒤 환경변수로 넣어주세요 — 기본값을 두지
# 않은 건, 존재하지 않는 버킷 이름으로 조용히 실패하는 대신 설정이 빠졌을 때
# 바로 에러로 드러나게 하기 위해서입니다.
# ============================================

---
spring:
  config:
    activate:
      on-profile: rds

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:13306/yorimichi?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # 운영 DB는 스키마를 코드가 건드리지 않도록 감니다
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

# 클라우드(ECS + RDS): Cognito(cognito_sub) 방식 UserMapper
mybatis:
  mapper-locations:
    - classpath:mapper/**/*.xml
    - classpath:mapper-cognito/**/*.xml

app:
  image:
    s3:
      bucket: test
      # bucket: ${S3_IMAGE_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
      # CloudFront 등 커스텀 도메인을 쓰면 여기에 넣고, 아니면 비워두세요
      # (비워두면 https://{bucket}.s3.{region}.amazonaws.com 형태로 자동 조립됩니다).
      public-base-url: ${S3_IMAGE_PUBLIC_BASE_URL:}
