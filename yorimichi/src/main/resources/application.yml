server:
  port: 9000

spring:
  application:
    name: yorimichi

  profiles:
    active: local

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update

  session:
    jdbc:
      initialize-schema: always

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: localhost
      port: 6379


# JWT
jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-bytes}
  access-token-validity: 3600000
  refresh-token-validity: 1209600000


# CORS
cors:
  allowed-origins:
    - http://localhost:*
    - http://127.0.0.1:*
    - http://192.168.*.*:*
    - http://172.16.*.*:*
    - http://172.17.*.*:*
    - http://172.18.*.*:*
    - http://172.19.*.*:*
    - http://172.2*.*.*:*
    - http://172.30.*.*:*
    - http://172.31.*.*:*
    - http://10.*.*.*:*


# MyBatis
mybatis:
  type-aliases-package: com.yorimichi.yorimichi.domain
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true


# 파일 업로드
file:
  upload:
    windows: C:\Users\hi02\dev\upload\
    linux: /app/upload/


# Python 서버
python:
  server:
    url: http://localhost:8000


# Google 로그인
google:
  client:
    id: ${GOOGLE_CLIENT_ID}
    secret: ${GOOGLE_CLIENT_SECRET}
  redirect:
    uri: http://localhost:5173/oauth/google/callback


# ============================================
# LOCAL — 로컬 MySQL
#
# 평소 개발할 때 쓰는 기본 프로필입니다.
# ============================================

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yorimichi_db?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
    username: yorimichi
    password: yorimichi


# ============================================
# RDS — AWS 운영 DB
#
# 접속 전에 SSM 터널을 먼저 열어야 합니다.
#   .\scripts\connect-rds.ps1
# 그 창을 닫으면 연결이 끊깁니다.
#
# 계정은 개인별로 다르므로 환경변수로 분리합니다.
#   DB_USERNAME : 본인 IAM 사용자명 (예: yoo-youngsu)
#   DB_PASSWORD : connect-rds.ps1이 클립보드에 복사해준 값
# ============================================

---
spring:
  config:
    activate:
      on-profile: rds

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:13306/yorimichi?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # 운영 DB는 스키마를 코드가 건드리지 않도록 감니다
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false